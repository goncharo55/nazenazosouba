# 毎日の市場データ(指数・為替・商品・暗号資産・値上がり/値下がりランキング)をyfinanceで取得して
# data/market_YYYY-MM-DD.json としてコミットする。日次記事ルーティン(クラウド)は
# Yahoo Financeに直接つなげないので、このファイルが記事の数値の「正」になる。
# 東証の大引け(15:30 JST)のあと、データが確定するのを待って 16:17 JST に実行する。
# 毎時0分はGitHub全体で予約実行が混み、飛ばされやすいので17分にずらしている（11/17の16:00は実行されなかった）。
name: market-data

on:
  schedule:
    - cron: "17 7 * * *"  # 07:17 UTC = 16:17 JST
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 YYYY-MM-DD (空なら今日のJST)"
        required: false

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-market.txt

      - run: pip install -r requirements-market.txt

      - name: Fetch market data
        id: fetch
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(TZ=Asia/Tokyo date +%F); fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          ok=0
          for i in 1 2 3; do
            if python fetch_market_data.py --date "$DATE"; then ok=1; break; fi
            echo "attempt $i failed; retrying in 60s"; sleep 60
          done
          if [ "$ok" != "1" ]; then echo "fetch failed after 3 attempts"; exit 1; fi

      # 金曜は週次データ(週刊動画用)も作る。前週金曜と今週金曜の market_*.json だけから計算する
      - name: Build weekly data (Thursdays = 週刊動画の公開日)
        run: |
          DATE="${{ steps.fetch.outputs.date }}"
          if [ "$(date -d "$DATE" +%u)" = "4" ]; then python build_weekly.py "$DATE"; fi

      - name: Commit data file
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data/market_*.json data/weekly_*.json 2>/dev/null || git add data/market_*.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "market data ${{ steps.fetch.outputs.date }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
