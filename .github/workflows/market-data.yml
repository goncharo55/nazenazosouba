# 毎日の市場データ(指数・為替・商品・暗号資産・値上がり/値下がりランキング)をyfinanceで取得して
# data/market_YYYY-MM-DD.json としてコミットする。日次記事ルーティン(クラウド)は
# Yahoo Financeに直接つなげないので、このファイルが記事の数値の「正」になる。
# 東証の大引け(15:30 JST)のあと 16:17 JST から実行する。
# GitHubの予約実行は数時間遅れたり飛ばされたりするうえ、Yahooに東証の当日分が載るのが遅い日もある
# （11/19・11/20は16:40ごろでも未反映）。そこで予約を何回か入れ、各回の中でも東証の値が揃うまで取り直す。
# 揃ったファイルは書き換えない（fetch_market_data.py が欠けているときだけ補完する）。
name: market-data

on:
  schedule:
    - cron: "17 7 * * *"   # 16:17 JST
    - cron: "47 7 * * *"   # 16:47 JST
    - cron: "23 8 * * *"   # 17:23 JST
    - cron: "13 9 * * *"   # 18:13 JST
    - cron: "43 11 * * *"  # 20:43 JST（予約が遅れた・Yahooの反映が遅い日の保険）
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 YYYY-MM-DD (空なら今日のJST)"
        required: false

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-market.txt

      - run: pip install -r requirements-market.txt

      - name: Fetch market data
        id: fetch
        run: |
          DATE="${{ github.event.inputs.date }}"
          # 予約が遅れて深夜に動いても、15:45より前なら前日分を対象にする（まだ始まっていない日のファイルを作らない）
          if [ -z "$DATE" ]; then
            if [ "$(TZ=Asia/Tokyo date +%H%M)" -ge 1545 ]; then DATE=$(TZ=Asia/Tokyo date +%F); else DATE=$(TZ=Asia/Tokyo date -d yesterday +%F); fi
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          ok=0
          for i in 1 2 3; do
            if python fetch_market_data.py --date "$DATE"; then ok=1; break; fi
            echo "attempt $i failed; retrying in 60s"; sleep 60
          done
          if [ "$ok" != "1" ]; then echo "fetch failed after 3 attempts"; exit 1; fi
          # 平日なのに東証の値が欠けていたら、5分おきに最大40分取り直す（祝日ならそのまま終わる）
          F="data/market_$DATE.json"
          for i in 1 2 3 4 5 6 7 8; do
            if ! python -c "import json,sys; e=json.load(open('$F',encoding='utf-8')).get('fetch_errors') or []; sys.exit(0 if e else 1)"; then break; fi
            echo "fetch_errors が残っているので5分後に取り直す ($i/8)"; sleep 300
            python fetch_market_data.py --date "$DATE" || true
          done

      # 金曜は週次データ(週刊動画用)も作る。前週金曜と今週金曜の market_*.json だけから計算する
      - name: Build weekly data (Thursdays = 週刊動画の公開日)
        run: |
          DATE="${{ steps.fetch.outputs.date }}"
          if [ "$(date -d "$DATE" +%u)" = "4" ]; then python build_weekly.py "$DATE"; fi

      - name: Commit data file
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data/market_*.json data/weekly_*.json 2>/dev/null || git add data/market_*.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "market data ${{ steps.fetch.outputs.date }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
